<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · OmniCourse</title>
  <meta name="description" content="Bản mẫu: tiến độ chương trình theo nhóm tín chỉ, GPA, dự kiến tốt nghiệp, học kỳ này và việc cần chú ý.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('oc2-theme'))||'light'}catch(e){}</script>
</head>
<body data-page="dashboard" data-layout="app">
  <a class="skip" href="#main">Bỏ qua điều hướng</a>
  <div class="app">
    <aside class="side" id="side"></aside>
    <main class="main" id="main">
      <div class="page">
        <header class="db-head">
          <h1>Dashboard</h1>
          <p class="db-who" id="who"></p>
        </header>

        <section class="card db-top" aria-label="Tiến độ chương trình">
          <div class="db-donut" id="donut"></div>
          <div class="db-side">
            <div class="db-row" id="row1"></div>
            <div class="db-row" id="row2"></div>
            <div class="db-key" id="key"></div>
          </div>
        </section>

        <div class="db-main">
          <section class="card" aria-labelledby="g-title">
            <div class="db-sec-head">
              <h2 id="g-title">Nhóm yêu cầu</h2>
              <div class="db-legend"><span><i></i>Đã đạt</span><span><i class="cur"></i>Đang học</span><span><i class="left"></i>Còn lại</span></div>
            </div>
            <div class="db-groups" id="groups"></div>
          </section>

          <div class="db-aside">
            <section class="card" aria-labelledby="term-title">
              <div class="db-sec-head">
                <h2 id="term-title"></h2>
                <span class="meta" id="term-tc"></span>
              </div>
              <div class="db-cur" id="cur"></div>
            </section>
            <section class="card" aria-labelledby="attn-title">
              <div class="db-sec-head"><h2 id="attn-title">Cần chú ý</h2></div>
              <div class="db-attn" id="attn"></div>
            </section>
          </div>
        </div>

        <section class="card db-terms-card" aria-labelledby="t-title">
          <div class="db-sec-head">
            <h2 id="t-title">Theo học kỳ</h2>
            <a class="meta" href="import.html">Nhập bảng điểm</a>
          </div>
          <div class="db-terms-wrap">
            <div class="db-terms" id="terms"></div>
            <div class="db-terms-key" id="terms-key"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div class="db-tip" id="tip" role="tooltip" aria-hidden="true"></div>

  <script src="assets/data.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      const D = window.OC, S = D.student, $ = (id) => document.getElementById(id);
      const plan = UI.plan();
      const res = D.check(plan);
      const req = D.totalRequired;
      const sumOf = (list) => list.reduce((s, x) => s + x.credits, 0);

      $('who').innerHTML = [S.full, S.className, S.id].map((t) => '<span>' + t + '</span>').join('<span class="sep" aria-hidden="true">·</span>');

      // Per group: done, in progress, and what is left to reach the required credits.
      const G = D.groups.map((g) => {
        const list = D.courses.filter((x) => x.group === g.id);
        const done = list.filter((x) => x.status === 'done');
        const cur = list.filter((x) => x.status === 'current');
        const todo = list.filter((x) => x.status === 'planned');
        const d = sumOf(done), c = sumOf(cur);
        return { g, done, cur, todo, d, c, left: Math.max(0, g.required - d - c) };
      });
      const curTotal = G.reduce((s, x) => s + x.c, 0);

      // ---------- Donut: every group's passed credits, then in progress, then still to take ----------
      // Passed fills the whole band, in progress only its outer half, still to take is air (shown on hover).
      const R = 104, r = 74, MID = (R + r) / 2, CX = 100, CY = 100, GAP = 0.6;
      const pt = (rad, deg) => { const a = (deg - 90) * Math.PI / 180; return [CX + rad * Math.cos(a), CY + rad * Math.sin(a)]; };
      const sector = (a0, a1, ro, ri) => {
        if (a1 - a0 <= 0.01) return '';
        ro = ro || R; ri = ri || r;
        const big = a1 - a0 > 180 ? 1 : 0, [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
        return 'M' + x0 + ' ' + y0 + 'A' + ro + ' ' + ro + ' 0 ' + big + ' 1 ' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + 'A' + ri + ' ' + ri + ' 0 ' + big + ' 0 ' + x3 + ' ' + y3 + 'Z';
      };
      const segs = [];
      ['d', 'c', 'left'].forEach((k) =>
        G.forEach((x) => { const n = k === 'd' ? Math.min(x.d, x.g.required) : x[k]; if (n > 0) segs.push({ x, n, k }); }));
      const ring = segs.reduce((s, x) => s + x.n, 0);
      let svg = '<svg viewBox="0 0 200 200" role="img" aria-label="' + D.done + ' trên ' + req + ' tín chỉ đã tích lũy. ' +
        G.map((x) => x.g.name + ' ' + x.d + ' trên ' + x.g.required).join(', ') + '">';
      let at = 0;
      segs.forEach((s) => {
        const span = s.n / ring * 360, a0 = at + GAP / 2, a1 = at + span - GAP / 2;
        const fill = s.k === 'd' ? '<path class="solid" d="' + sector(a0, a1) + '"/>'
          : s.k === 'c' ? '<path class="air" d="' + sector(a0, a1, MID, r) + '"/><path class="solid" d="' + sector(a0, a1, R, MID) + '"/>'
          : '<path class="air" d="' + sector(a0, a1) + '"/>';
        svg += '<g class="arc g-' + s.x.g.id + '" data-g="' + s.x.g.id + '">' + fill + '<path class="hit" d="' + sector(at, at + span) + '"/></g>';
        at += span;
      });
      $('donut').innerHTML = svg + '</svg><div class="db-center" id="center"></div>';
      const centerHtml = (x) => x
        ? '<small>' + x.g.short + '</small><b>' + x.d + '</b><span>/ ' + x.g.required + ' tín chỉ</span>'
        : '<b>' + D.done + '</b><span>/ ' + req + ' tín chỉ</span>';
      let centerFor;
      const center = (x) => {
        if (centerFor === x) return;
        centerFor = x;
        const el = $('center');
        el.classList.add('swap');
        clearTimeout(center.t);
        center.t = setTimeout(() => { el.innerHTML = centerHtml(x); el.classList.remove('swap'); }, 110);
      };
      $('center').innerHTML = centerHtml(null); centerFor = null;

      // Tooltip follows the cursor and flips near the viewport edge.
      const tip = $('tip'), donut = $('donut');
      const tipFor = (x) => '<div class="g-' + x.g.id + '"><b><i></i>' + x.g.name + '</b>' +
        '<p><span>Đã đạt</span><span>' + x.d + ' TC</span></p><p><span>Đang học</span><span>' + x.c + ' TC</span></p>' +
        '<p><span>Còn lại</span><span>' + x.left + ' TC</span></p><p><span>Yêu cầu</span><span>' + x.g.required + ' TC</span></p></div>';
      const focusGroup = (id) => {
        donut.classList.toggle('focus', !!id);
        donut.querySelectorAll('.arc').forEach((a) => a.classList.toggle('on', a.dataset.g === id));
        $('key').querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.g === id));
        center(id ? G.find((x) => x.g.id === id) : null);
      };
      const place = (e) => {
        const w = tip.offsetWidth, h = tip.offsetHeight;
        let x = e.clientX + 16, y = e.clientY + 16;
        if (x + w > innerWidth - 8) x = e.clientX - w - 16;
        if (y + h > innerHeight - 8) y = e.clientY - h - 16;
        tip.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      };
      // Leaving one arc for the next crosses a hairline gap, so wait a beat before clearing.
      let shown = null, leave = 0;
      const clear = () => { clearTimeout(leave); leave = setTimeout(() => { shown = null; tip.classList.remove('show'); focusGroup(null); }, 90); };
      donut.addEventListener('pointermove', (e) => {
        const a = e.target.closest('.arc');
        if (!a) { if (shown) clear(); return; }
        clearTimeout(leave);
        if (shown !== a.dataset.g) { shown = a.dataset.g; tip.innerHTML = tipFor(G.find((x) => x.g.id === shown)); I18N.flush(); focusGroup(shown); }
        place(e);
        tip.classList.add('show');
      });
      donut.addEventListener('pointerleave', clear);
      donut.addEventListener('click', (e) => { const a = e.target.closest('.arc'); if (a) location.href = 'audit.html#' + a.dataset.g; });

      $('key').innerHTML = G.map((x) => '<a class="g-' + x.g.id + '" data-g="' + x.g.id + '" href="audit.html#' + x.g.id + '"><i></i><span>' + x.g.short + '</span></a>').join('');
      $('key').querySelectorAll('a').forEach((a) => {
        a.addEventListener('mouseenter', () => focusGroup(a.dataset.g));
        a.addEventListener('focus', () => focusGroup(a.dataset.g));
        a.addEventListener('mouseleave', () => focusGroup(null));
        a.addEventListener('blur', () => focusGroup(null));
      });

      // ---------- Four slim stats ----------
      const H = D.history, last = D.last, prev = H[H.length - 2];
      const pct = (last.cum - prev.cum) / prev.cum * 100;
      const spark = (vals, lo, hi) => {
        const w = 84, h = 30, step = w / (vals.length - 1), y = (v) => h - 3 - (v - lo) / (hi - lo) * (h - 6);
        const pts = vals.map((v, i) => [i * step, y(v)]);
        return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><polyline points="' + pts.map((p) => p.join(',')).join(' ') +
          '" fill="none" style="stroke:var(--info)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1] + '" r="2.8" style="fill:var(--info)"/></svg>';
      };
      const bars = (vals, lo, hi) => '<svg width="72" height="30" viewBox="0 0 72 30" aria-hidden="true">' + vals.map((v, i) => {
        const h = 4 + (v - lo) / (hi - lo) * 24;
        return '<rect x="' + i * 12.4 + '" y="' + (30 - h) + '" width="8" height="' + h + '" rx="2" style="fill:' + (i === vals.length - 1 ? 'var(--ok)' : 'var(--surface-3)') + '"/>';
      }).join('') + '</svg>';
      const est = res.est || res.lastUsed;
      const estEnd = (est.when || '').split('–').pop().trim().slice(3);
      const stat = (k, v, end, wide, title) => '<div class="db-stat' + (wide ? ' wide' : '') + '"' + (title ? ' title="' + title + '"' : '') + '><div><div class="v">' + v + '</div><div class="k">' + k + '</div></div>' + (end ? '<div class="end">' + end + '</div>' : '') + '</div>';
      $('row1').innerHTML =
        stat('GPA tích lũy', last.cum.toFixed(2) + '<small>/10</small>',
          '<span class="delta ' + (pct >= 0 ? 'up' : 'down') + '" title="So với cuối ' + prev.term.label + '">' + (pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(1) + '%</span>' + spark(H.map((h) => h.cum), 7, 9), true) +
        stat('Dự kiến tốt nghiệp', 'HK' + est.n + ' ' + est.year + '–' + String(est.year + 1).slice(2), estEnd ? '<span class="small t3">' + estEnd + '</span>' : '', false, est.label);
      $('row2').innerHTML =
        stat('Cần để tốt nghiệp', (req - D.done) + '<small>TC</small>', '<span class="small t3">' + curTotal + ' TC đang học</span>') +
        stat('Điểm rèn luyện', last.drl + '<small>/100</small>', '<span class="chip ok">' + D.drlRank(last.drl) + '</span>' + bars(H.map((h) => h.drl), 70, 100), true);

      // ---------- Group progress bars with a spoiler of courses ----------
      const pc = (n, of) => (n / of * 100) + '%';
      const item = (x, sq, right) => '<div class="db-item"><span class="sq ' + sq + '"></span><span class="n">' + x.name + '</span><span class="cd">' + x.code + '</span><span class="r">' + right + '</span></div>';
      const sec = (title, total, rows) => '<div class="db-sec"><h4><span>' + title + '</span><span>' + total + ' tín chỉ</span></h4>' + rows + '</div>';
      $('groups').innerHTML = G.map((x) => {
        const g = x.g;
        // Still to take, grouped by the term the plan puts it in.
        const byTerm = {};
        x.todo.forEach((c) => { (byTerm[c.term] = byTerm[c.term] || []).push(c); });
        const placed = sumOf(x.todo);
        let todo = Object.keys(byTerm).sort((a, b) => D.tIdx(a) - D.tIdx(b)).map((t) => {
          const term = D.term(t);
          return sec('Học kỳ ' + term.n + ', ' + term.year + '–' + String(term.year + 1).slice(2), sumOf(byTerm[t]),
            byTerm[t].map((c) => c.slot
              ? '<div class="db-item"><span class="sq todo"></span><span class="n t3">Tự chọn chưa chọn môn</span><span class="cd">—</span><span class="r">' + c.credits + ' TC</span></div>'
              : item(c, 'todo', c.credits + ' TC')).join(''));
        }).join('');
        if (x.left > placed) todo += sec('Chưa xếp vào lộ trình', x.left - placed, '<p class="db-none">Kéo thêm học phần ' + g.short.toLowerCase() + ' vào lộ trình để đủ ' + g.required + ' tín chỉ.</p>');
        return '<details class="db-g g-' + g.id + '"><summary>' +
          '<span class="nm">' + g.name + '</span>' +
          '<span class="cnt"><b>' + x.d + '</b>/' + g.required + '</span>' +
          '<span class="db-bar" role="img" aria-label="Đã đạt ' + x.d + ', đang học ' + x.c + ', còn lại ' + x.left + ' trên ' + g.required + ' tín chỉ">' +
          '<i class="d" style="width:' + pc(Math.min(x.d, g.required), g.required) + '"></i>' + (x.c ? '<i class="c" style="width:' + pc(x.c, g.required) + '"></i>' : '') + '</span>' +
          icon('down', 'sm chev') + '</summary>' +
          '<div class="db-spoil">' +
          (x.cur.length ? sec('Đang học', x.c, x.cur.map((c) => item(c, 'cur', c.credits + ' TC')).join('')) : '') +
          todo +
          (x.done.length ? sec('Đã đạt', x.d, x.done.map((c) => item(c, '', 'Điểm ' + c.grade.toFixed(1).replace('.0', ''))).join('')) : '') +
          '</div></details>';
      }).join('');

      // ---------- This term ----------
      const now = D.term(D.NOW);
      const nowList = D.courses.filter((x) => x.status === 'current');
      $('term-title').textContent = 'Học kỳ ' + now.n + ', năm ' + (now.year - 2024 + 1) + ' (' + now.year + '–' + (now.year + 1) + ')';
      $('term-tc').textContent = sumOf(nowList) + ' tín chỉ';
      $('cur').innerHTML = nowList.map((x) =>
        '<a class="row g-' + x.group + '" href="audit.html#' + x.group + '"><span class="sq"></span><span>' + x.name + '</span><span class="cd">' + x.code + '</span></a>').join('');

      // ---------- Needs attention: each card opens the page that fixes it ----------
      const read = new Set(UI.store.get('read', []));
      const attn = [];
      const bad = res.violations.filter((v) => v.kind !== 'cover');
      if (bad.length) attn.push(['bad', '<span>' + bad.length + '</span>', bad.length + ' vi phạm trong lộ trình', 'Sửa trong lộ trình', 'planner.html']);
      attn.push(['warn', icon('flag', 'sm'), 'Chưa có chứng chỉ ngoại ngữ', 'Xem điều kiện', 'audit.html#eng']);
      if (res.slots.length) attn.push(['warn', icon('plus', 'sm'), '3 TC tự chọn chưa chọn môn', 'Chọn môn', 'planner.html']);
      D.notes.filter((n) => n.unread && n.act && n.kind !== 'plan' && !read.has(n.id))
        .forEach((n) => attn.push(['info', icon(n.kind === 'term' ? 'calendar' : 'file', 'sm'), n.title, n.cta, n.href]));
      $('attn').innerHTML = attn.map(([t, tl, title, cta, href]) =>
        '<a class="' + t + '" href="' + href + '"><span class="tl">' + tl + '</span><span style="min-width:0"><b>' + title + '</b><small>' + cta + '</small></span>' + icon('chev', 'sm chev') + '</a>').join('');
      // ---------- By term: one square per credit, in the group's colour ----------
      const cell = (c, st) => Array.from({ length: c.credits }, () => '<i class="g-' + c.group + (st ? ' ' + st : '') + '" title="' + c.code + ' · ' + c.name + ' · ' + c.credits + ' TC"></i>').join('');
      const used = D.terms.filter((t) => D.courses.some((c) => c.status !== 'failed' && (D.tIdx(t.id) <= D.tIdx(D.NOW) ? c.term === t.id : D.termOf(plan, c.code) === t.id)));
      $('terms').innerHTML = used.map((t) => {
        const isNow = t.id === D.NOW, past = D.tIdx(t.id) < D.tIdx(D.NOW);
        const list = D.courses.filter((c) => c.status !== 'failed' && (past || isNow ? c.term === t.id : D.termOf(plan, c.code) === t.id));
        const label = (t.n === 3 ? 'Hè ' : 'HK' + t.n + ' ') + String(t.year).slice(2) + '–' + String(t.year + 1).slice(2) + (isNow ? ' · nay' : '');
        return '<a class="db-term' + (isNow ? ' now' : '') + '" href="planner.html" aria-label="' + t.label + ', ' + sumOf(list) + ' tín chỉ"><span class="cells">' +
          list.map((c) => cell(c, past ? '' : isNow ? 'cur' : 'todo')).join('') + '</span><span class="lb">' + label + '</span></a>';
      }).join('') + '<a class="db-term grad" href="audit.html"><span class="cells">' + icon('flag') + '</span><span class="lb">Tốt nghiệp</span></a>';
      $('terms-key').innerHTML = D.groups.map((g) => '<span class="g-' + g.id + '"><i></i>' + g.short + '</span>').join('') +
        '<span class="gap"></span><span><i></i>Đã đạt</span><span><i class="cur"></i>Đang học</span><span><i class="todo"></i>Dự kiến</span>';
    })();
  </script>
</body>
</html>
