<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông báo · OmniCourse</title>
  <meta name="description" content="Bản mẫu: việc cần xử lý, nhắc kỳ đăng ký, check-in đầu kỳ, bảng điểm thay đổi.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <!-- Hold the first paint until the scripts at the end of body have built and translated the page. -->
  <link rel="expect" href="#ready" blocking="render">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('oc2-theme'))||'light'}catch(e){}
  // Keep the page hidden until its fonts are in (at most 1 s), so no page ever shows the fallback font.
  (function(d){if(!document.fonts)return;d.classList.add('fonts-wait');var done=function(){d.classList.remove('fonts-wait')};Promise.all(['400','500','600','700'].map(function(w){return document.fonts.load(w+' 16px "Be Vietnam Pro"','Aạ')}).concat(document.fonts.load('500 14px "JetBrains Mono"','A1'))).then(done,done);setTimeout(done,1000)})(document.documentElement);</script>
</head>
<body data-page="inbox" data-layout="app">
  <a class="skip" href="#main">Bỏ qua điều hướng</a>
  <div class="app">
    <aside class="side" id="side"></aside>
    <main class="main" id="main">
      <div class="page">
        <header class="page-head">
          <div>
            <h1>Thông báo</h1>
            <p id="sub"></p>
          </div>
          <div class="head-actions">
            <button class="btn" type="button" id="all-read"><i data-icon="check"></i>Đánh dấu đã đọc hết</button>
            <a class="btn ghost" href="settings.html#notify"><i data-icon="sliders"></i>Tùy chọn</a>
          </div>
        </header>
        <div class="inbox">
          <nav class="card filters" id="filters" aria-label="Lọc thông báo"></nav>
          <section class="card" aria-label="Danh sách thông báo" id="list"></section>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      const D = window.OC, $ = (id) => document.getElementById(id);
      const KIND = {
        plan: ['Lộ trình', 'columns', 'elec'], term: ['Học kỳ', 'calendar', 'core'], record: ['Bảng điểm', 'file', 'gen'],
        audit: ['Học vụ', 'cap', 'pol'], system: ['Hệ thống', 'info', 'thesis'],
      };
      const read = new Set(UI.store.get('read', []));
      let filter = 'act';
      const isUnread = (n) => n.unread && !read.has(n.id);
      const FILTERS = [['act', 'Cần xử lý', (n) => n.act], ['all', 'Tất cả', () => true]].concat(Object.keys(KIND).map((k) => [k, KIND[k][0], (n) => n.kind === k]));

      function render() {
        const un = D.notes.filter(isUnread).length;
        $('sub').textContent = un + ' chưa đọc · ' + D.notes.filter((n) => n.act).length + ' việc cần xử lý. Nhắc theo lịch của bạn, không gửi gì cho trường.';
        $('filters').innerHTML = FILTERS.map(([k, l, f]) => '<button type="button" data-f="' + k + '" aria-pressed="' + (k === filter) + '"><span>' + l + '</span><small>' + D.notes.filter(f).length + '</small></button>').join('');
        const f = FILTERS.find((x) => x[0] === filter)[2];
        const list = D.notes.filter(f);
        $('list').innerHTML = list.length ? list.map((n) => {
          const k = KIND[n.kind];
          return '<article class="note-item' + (isUnread(n) ? ' unread' : '') + '">' +
            '<span class="glyph g-' + k[2] + '">' + icon(k[1]) + '</span>' +
            '<div><div class="title">' + n.title + '</div><p>' + n.text + '</p>' +
            '<div class="head-actions"><a class="btn sm' + (n.act ? ' primary' : '') + '" href="' + n.href + '" data-id="' + n.id + '">' + n.cta + ' ' + icon('chev', 'sm') + '</a>' +
            '<span class="chip soft g-' + k[2] + '">' + k[0] + '</span></div></div>' +
            '<time>' + n.when + '</time></article>';
        }).join('') : '<div class="empty">' + icon('check', 'lg') + '<b>Không còn gì ở đây</b><p class="small">Khi có việc mới, chuông ở thanh bên sẽ báo.</p></div>';
      }
      $('filters').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { filter = b.dataset.f; render(); } });
      $('list').addEventListener('click', (e) => { const a = e.target.closest('[data-id]'); if (a) { read.add(a.dataset.id); UI.store.set('read', [...read]); } });
      $('all-read').addEventListener('click', () => { D.notes.forEach((n) => read.add(n.id)); UI.store.set('read', [...read]); render(); document.querySelectorAll('.side .badge, .tabbar .badge').forEach((b) => b.remove()); UI.toast('Đã đánh dấu đã đọc'); });
      render();
    })();
  </script>
  <i id="ready" hidden></i>
</body>
</html>
