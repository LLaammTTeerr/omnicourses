<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lộ trình được chia sẻ · OmniCourse</title>
  <meta name="description" content="Bản mẫu: lộ trình chỉ đọc cho giảng viên cố vấn, không cần tài khoản.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('oc2-theme'))||'light'}catch(e){}</script>
</head>
<body data-page="shared" data-layout="public">
  <main class="pub-main" id="main"><div class="page" id="page"></div></main>

  <script src="assets/data.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    (function () {
      const D = window.OC, $ = (id) => document.getElementById(id);
      function render() {
        if (location.hash === '#dead') {
          $('page').innerHTML = '<div class="card empty" style="padding:70px 24px;max-width:620px;margin:40px auto"><span class="glyph xl g-thesis">∅</span><h1 style="font-size:34px">Lộ trình này không được chia sẻ</h1>' +
            '<p class="t2">Link có thể đã bị tắt, gõ sai, hoặc chưa từng tồn tại. Hãy hỏi lại người gửi link.</p><a class="btn" href="index.html">Về trang giới thiệu</a></div>';
          return;
        }
        const S = UI.store.get('plans', null);
        const name = S ? S.list[S.active].name : 'Kế hoạch chính';
        const plan = UI.plan(), res = D.check(plan);
        const sh = UI.store.get('shared', null);
        const cols = [D.NOW].concat(D.future.map((t) => t.id)).filter((id) => D.load(plan, id) > 0);
        $('page').innerHTML =
          '<div class="shared-banner">' + icon('eye') + '<b>Lộ trình được chia sẻ · chỉ đọc</b><span class="small" style="opacity:.8">Sửa lần cuối 30/10/2026 lúc 21:14</span></div>' +
          '<header class="page-head"><div><p class="eyebrow">' + (sh && sh.name ? D.student.name + ' chia sẻ' : 'Một sinh viên chia sẻ') + '</p><h1>' + name + '</h1>' +
          '<p>' + D.student.programName + ' · ' + D.student.cohort + ' · ' + D.student.curriculum + '</p></div>' +
          '<div class="est' + (res.est ? '' : ' bad') + '"><span class="cap">' + icon(res.est ? 'cap' : 'alert') + '</span><div><small>' + (res.est ? 'Tốt nghiệp dự kiến (rule engine)' : 'Rule engine báo ' + res.violations.length + ' vi phạm') + '</small><b>' + (res.est || res.lastUsed).label + '</b></div></div></header>' +
          (res.violations.length ? '<section class="card"><div class="card-head"><h2>Vi phạm rule engine đang báo</h2></div><div class="vlist">' +
            res.violations.map((v) => '<div class="vrow' + (v.kind === 'cover' ? ' cover' : '') + '"><span class="ic">' + icon('alert', 'sm') + '</span><div><b>Vi phạm: ' + v.title + '</b><p>' + v.text + '</p></div><span></span></div>').join('') + '</div></section>' : '') +
          '<div class="ro-board">' + cols.map((id) => {
            const t = D.term(id), list = D.courses.filter((x) => D.termOf(plan, x.code) === id), l = D.load(plan, id);
            return '<section class="col' + (id === D.NOW ? ' now' : '') + '"><div class="col-head"><div class="row"><b>' + t.label + '</b>' + (id === D.NOW ? '<span class="chip info">Đang học</span>' : '') + '</div>' +
              '<div class="load"><span><b>' + l + '</b> TC</span><span>' + (t.when || '') + '</span></div></div>' +
              '<div class="drop">' + list.map((x) => UI.tile(x, { status: id === D.NOW ? 'current' : 'planned', sub: D.group(x.group).short })).join('') + '</div></section>';
          }).join('') + '</div>' +
          '<div class="legend">' + D.groups.map((g) => '<span><i style="background:var(--' + g.id + ')"></i>' + g.name + '</span>').join('') + '</div>' +
          '<p class="small t3">Trang này không hiện điểm, email, MSSV, bảng điểm hay các kế hoạch khác. Công cụ tìm kiếm không lập chỉ mục trang này.</p>';
      }
      window.addEventListener('hashchange', render);
      render();
    })();
  </script>
</body>
</html>
