name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Release workflow for the Version Packages PR.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # npm 10 (bundled with Node 22) crashes resolving this dependency tree; npm 11 does not.
  NPM_VERSION: 11.21.1

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changeset in this PR
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The Version Packages PR consumes changesets instead of adding one.
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "Version Packages PR: no changeset needed."; exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: nothing to check."; exit 0
          fi
          added=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- '.changeset/*.md' ':!.changeset/README.md')
          if [ -z "$added" ]; then
            echo "::error::This PR has no changeset. Run 'npx changeset' (or 'npx changeset --empty' for changes that need no release) and commit the file."
            exit 1
          fi
          echo "Changesets in this PR:"; echo "$added"

  # Squash merges are signed by GitHub, so main's "required signatures" rule
  # alone would let unsigned branch commits through. Check every PR commit.
  signed-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Every commit in this PR is signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: nothing to check."; exit 0
          fi
          unsigned=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | select(.commit.verification.verified | not) | "\(.sha[0:7]) \(.commit.verification.reason) \(.commit.message | split("\n")[0])"')
          if [ -n "$unsigned" ]; then
            echo "::error::Unsigned or unverified commits (see CONTRIBUTING.md, 'Every commit must be signed'):"
            echo "$unsigned"; exit 1
          fi
          echo "All commits verified."

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: omnicourse
          POSTGRES_PASSWORD: omnicourse
          POSTGRES_DB: omnicourse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omnicourse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://omnicourse:omnicourse@localhost:5432/omnicourse
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run typecheck -w src/backend
      - run: npm run test -w src/backend
      - run: npm run build -w src/backend
      - run: npm run test:e2e -w src/backend
      - name: Export OpenAPI contract
        run: npm run openapi -w src/backend
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: src/backend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run typecheck -w src/frontend
      - run: npm run test -w src/frontend
      - run: npm run build -w src/frontend
