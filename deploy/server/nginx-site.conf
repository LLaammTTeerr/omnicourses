# OmniCourse __ENV__ at __HOST__. Generated by deploy/server/setup.sh from deploy/server/nginx-site.conf:
# edit the template in the repository and re-run setup.sh, not this file.
server {
    listen 80;
    listen [::]:80;
    # __TLS__ listen 443 ssl;
    # __TLS__ listen [::]:443 ssl;
    server_name __HOST__;
    # __TLS__ ssl_certificate /etc/letsencrypt/live/__HOST__/fullchain.pem;
    # __TLS__ ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;

    # Only Cloudflare (and loopback) may reach this origin; a direct hit on the IP is dropped.
    if ($omnicourse_via_cloudflare = 0) { return 444; }

    root /opt/omnicourse/__ENV__/current/src/frontend/dist;
    index index.html;
    client_max_body_size 6m;   # UC-02 transcript uploads are capped at 5 MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr is the visitor: the host's 00-cloudflare-real-ip.conf restores it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;       # F8 streams its answers (server-sent events)
        proxy_read_timeout 120s;
    }

    # Vite puts a content hash in every asset name, so assets never change in place.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The single-page app: every other path is index.html, never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
