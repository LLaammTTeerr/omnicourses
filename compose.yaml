# Local services. Works with `podman compose` and `docker compose`.
services:
  db:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_USER: omnicourse
      POSTGRES_PASSWORD: omnicourse
      POSTGRES_DB: omnicourse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicourse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
